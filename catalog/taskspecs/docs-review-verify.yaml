# UC1: review the factory's release-docs PR against the train's versions on a running stack
# (10 §TaskSpecs, catalog-poc LLD; P1 §4). docs-review with the environment release-docs
# declares (local-dev's clean slate, at inputs.versions): the same skills, prompt, identity,
# effects and outcomes. docs-review stays without one, for epic stacks and people's PRs.
# Not the showcase: its demo agents need GitHub PATs, and no credential goes into the workspace.
# release-docs declares the same environment: keep the two equal.
#
# Workspace: the docs repo is read-only and local-dev a read repo. checkout: read-only can't
# combine with repos (the pipeline mounts only the repo items then, without the task repo), so
# the docs repo is a ro repo item, from the task's target as in release-docs. It is checked out
# at main: the review skill checks the PR head out in its own workspace.
#
# Read repos: local-dev is private, so the TaskSpec doesn't set workspace.publicReads (as
# release-docs). Hosts: as docs-review (FACTORY-CAT-002).
kind: TaskSpec
metadata: { name: docs-review-verify }
spec:
  description: Review the release-docs PR for accuracy against the train's CCF versions on a running stack, style, versioning and i18n.
  inputs:
    target:        { type: string, enum: [pr, stack], default: pr }
    verifyAgainst: { type: object }               # { train } or { repo, tag }: the versions the claims are checked against
    checks:        { type: array, default: [style, build] }   # + version-accuracy, versioning, i18n
    versions:      { type: object }               # component → version the environment runs (the train's releases)
  instructions: { template: prompts/docs-review.md.tmpl, headless: true }
  skills: [{ source: ccf-skills, ref: v0.9.0, use: ["ccf-review:review", docs-style, docs-verify, ccf-test] }]
  harness: { default: { name: claude-code, config: { model: "claude-{sonnet,opus}-5-*", reasoningEffort: high } } }
  workspace:
    repos:
      - { ref: "=task.target.repo + '@main'", mode: ro }        # the docs repo, read-only
      - { ref: compliance-framework/local-dev@main, mode: ro }  # the environment (private: its own read token)
    hosts: [registry.yarnpkg.com, registry.npmjs.org]
    environment:
      # local-dev's clean slate, up before the harness starts (P1 §4). The ro repos are under
      # /work/ro/<name>; the scripts run as the run's user (admin, in the docker group) in the
      # VM, which has its own Docker.
      versions: { from: inputs, input: versions }
      setup: |
        corepack enable
      up: |
        cd /work/ro/local-dev
        [ -f .env ] || cp .env.example .env       # the Makefile includes .env
        export COMPOSE_COMMAND="docker compose"   # local-dev's default is podman-compose
        # CCF_IMAGES=file: local-dev's file pins, as latest (its default) would look every release
        # up on api.github.com and replace the pins. FACTORY_VERSION_API/_UI/_AGENT (the train's
        # api, ui and agent releases) pin CCF_API_IMAGE, CCF_UI_IMAGE and CCF_AGENT_VERSION,
        # without the release's v; the components not set keep the file pins.
        export CCF_IMAGES=file
        [ -z "${FACTORY_VERSION_API:-}" ] || export CCF_API_IMAGE="ghcr.io/compliance-framework/api:${FACTORY_VERSION_API#v}"
        [ -z "${FACTORY_VERSION_UI:-}" ] || export CCF_UI_IMAGE="ghcr.io/compliance-framework/ui:${FACTORY_VERSION_UI#v}"
        [ -z "${FACTORY_VERSION_AGENT:-}" ] || export CCF_AGENT_VERSION="${FACTORY_VERSION_AGENT#v}"
        # postgres, api, ui, smtp4dev and one bare agent (slate-agent, no plugins): no kind
        # cluster, no showcase data. create-user races the API's migrations on a fresh stack (P1
        # Phase 0 report, Q3): every step is idempotent, so a failed first pass is retried once.
        make demo-up-slate || make demo-up-slate
      exposes: { FACTORY_STACK_URL: "http://localhost:8000", FACTORY_STACK_API: "http://localhost:8080" }
      ready: { http: ["http://localhost:8080/api/health", "http://localhost:8000/"], timeout: 20m }
      down: |
        COMPOSE_COMMAND="docker compose" make -C /work/ro/local-dev compose-down-slate
  identity: reviewer
  permissions: { pull_requests: write, contents: read }
  effects: { allow: [review.comment, review.request-changes, review.approve, thread.reply] }
  limits: { maxWallClock: 90m }                   # docs-review's 60m plus the environment's (ready.timeout 20m)
  output: { schema: schemas/results/review.json, outcomes: [approved, changes-requested, commented, needs-human] }
